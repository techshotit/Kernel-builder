name: Build RTL8192EU Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential bc bison flex libssl-dev git libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Samsung Kernel Source
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git source

      - name: Configure and Full Module Build
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make gki_defconfig

          # Enable complete networking, mac80211, and Realtek rtl8xxxu
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --module CONFIG_RTL8XXXU
          scripts/config --enable CONFIG_RTL8XXXU_UNTESTED

          make olddefconfig
          
          # Step 1: Build kernel symbols required for .ko linking
          make -j$(nproc) vmlinux KCFLAGS="-Wno-error"
          
          # Step 2: Build and link all kernel modules into binary .ko files
          make -j$(nproc) modules KCFLAGS="-Wno-error"

          # Step 3: Collect generated .ko files
          mkdir -p ../output
          find . -name "rtl8xxxu.ko" -exec cp -v {} ../output/ \;
          find . -name "mac80211.ko" -exec cp -v {} ../output/ \; 2>/dev/null || true
          find . -name "cfg80211.ko" -exec cp -v {} ../output/ \; 2>/dev/null || true

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8xxxu-kernel-modules
          path: output/*.ko
