name: Build RTL8192EU Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3 \
            rsync \
            cpio \
            kmod

      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            https://github.com/devhunter1/android_kernel_samsung_s5e8535.git \
            source

      - name: Configure Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make gki_defconfig

          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_MODULES
          scripts/config --module CONFIG_RTL8XXXU

          if grep -q "config RTL8XXXU_UNTESTED" \
            drivers/net/wireless/realtek/rtl8xxxu/Kconfig; then
            scripts/config --enable CONFIG_RTL8XXXU_UNTESTED
          fi

          make olddefconfig

          echo "RTL8XXXU configuration:"
          grep -E 'CONFIG_(RTL8XXXU|CFG80211|MAC80211|WLAN|USB|MODULES)=' .config || true

      - name: Prepare Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make prepare
          make modules_prepare

      - name: Build Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc) vmlinux \
            KCFLAGS="-Wno-error -Wno-error=unused-variable -Wno-error=unused-function"

      - name: Check Kernel Symbols
        run: |
          cd source

          if [ ! -f Module.symvers ]; then
            echo "ERROR: Module.symvers was not generated"
            exit 1
          fi

          echo "Module.symvers:"
          ls -lh Module.symvers

      - name: Build RTL8XXXU
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc) \
            M=drivers/net/wireless/realtek/rtl8xxxu \
            modules \
            KCFLAGS="-Wno-error"

      - name: Verify RTL8XXXU
        run: |
          cd source

          echo "Searching for rtl8xxxu.ko..."

          find . -name "rtl8xxxu.ko" -print

          if [ ! -f \
            drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko ]; then

            echo "ERROR: rtl8xxxu.ko was not generated"

            echo
            echo "Configuration:"
            grep -E \
              'CONFIG_(RTL8XXXU|CFG80211|MAC80211|WLAN|USB|MODULES)=' \
              .config || true

            echo
            echo "Driver directory:"
            ls -la \
              drivers/net/wireless/realtek/rtl8xxxu/

            exit 1
          fi

          echo
          echo "================================"
          echo "RTL8XXXU BUILD SUCCESS"
          echo "================================"

      - name: Create Output
        run: |
          mkdir -p output

          cp \
            source/drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko \
            output/rtl8xxxu.ko

          cp source/.config \
            output/kernel.config

          cp source/Module.symvers \
            output/Module.symvers

          cd source
          make kernelversion > ../output/kernel.version

          cd ..

          echo "Output:"
          ls -lh output/

          echo
          echo "Module information:"
          modinfo output/rtl8xxxu.ko || true

      - name: Create README
        run: |
          cat > output/README.txt <<'EOF'
          Samsung S5E8535 RTL8192EU Driver
          =================================

          Driver:
          rtl8xxxu.ko

          Architecture:
          ARM64

          This is the RTL8XXXU driver from the Samsung kernel source.

          IMPORTANT:
          The module must match the kernel running on the phone.

          Check phone kernel:

              uname -a
              uname -r
              cat /proc/version

          Test on a rooted phone:

              su
              insmod rtl8xxxu.ko

          Then check:

              dmesg | tail -100
              ip link
              iw dev

          If "Invalid module format" appears, check:

              dmesg | grep -i module

          The module may require the exact matching Samsung kernel
          configuration, Module.symvers and kernel build.
          EOF

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-s5e8535
          path: output/
          if-no-files-found: error
          retention-days: 30
