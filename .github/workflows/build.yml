name: Build RTL8192EU Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3 \
            rsync \
            cpio \
            kmod

      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            https://github.com/devhunter1/android_kernel_samsung_s5e8535.git \
            source

      - name: Configure Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make gki_defconfig

          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_MODULES
          scripts/config --module CONFIG_RTL8XXXU

          if grep -q "config RTL8XXXU_UNTESTED" \
            drivers/net/wireless/realtek/rtl8xxxu/Kconfig; then
            scripts/config --enable CONFIG_RTL8XXXU_UNTESTED
          fi

          make olddefconfig

          echo "RTL8XXXU:"
          grep CONFIG_RTL8XXXU .config || true

      - name: Prepare Module Build
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make prepare
          make modules_prepare

      - name: Build RTL8XXXU
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc) \
            M=drivers/net/wireless/realtek/rtl8xxxu \
            modules \
            KCFLAGS="-Wno-error"

      - name: Check Driver
        run: |
          cd source

          echo "Searching for rtl8xxxu.ko..."

          find . -name "rtl8xxxu.ko" -print

          if [ ! -f \
            drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko ]; then

            echo "ERROR: rtl8xxxu.ko was not created"

            echo
            echo "Configuration:"
            grep -E \
              'CONFIG_(RTL8XXXU|CFG80211|MAC80211|WLAN|USB|MODULES)=' \
              .config || true

            echo
            echo "Driver directory:"
            ls -la \
              drivers/net/wireless/realtek/rtl8xxxu/

            exit 1
          fi

          echo
          echo "RTL8XXXU MODULE SUCCESSFULLY BUILT"

      - name: Create Output
        run: |
          mkdir -p output

          cp \
            source/drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko \
            output/rtl8xxxu.ko

          cp source/.config \
            output/kernel.config

          if [ -f source/Module.symvers ]; then
            cp source/Module.symvers output/Module.symvers
          fi

          cd source
          make kernelversion > ../output/kernel.version

          cd ..

          file output/rtl8xxxu.ko

          echo
          echo "Output:"
          ls -lh output/

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-s5e8535
          path: output/
          if-no-files-found: error
          retention-days: 30
