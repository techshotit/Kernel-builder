name: Build RTL8192EU Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Build Tools
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential bc bison flex libssl-dev git libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Kernel & 5.15+ Patched Realtek Driver
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git source
          cd source/drivers/net/wireless
          # 5.15/5.16 kernel patched driver repository
          git clone --depth=1 https://github.com/pure100kim/rtl8192eu-driver.git rtl8192eu
          echo "obj-m += rtl8192eu/" >> Makefile
          sed -i 's/---help---/help/g' rtl8192eu/Kconfig || true
          sed -i '/endif/i source "drivers/net/wireless/rtl8192eu/Kconfig"' Kconfig

      - name: Build Standalone Module
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS="-Wno-error -Wno-incompatible-function-pointer-types -Wno-header-guard -Wno-unused-variable -Wno-unused-function"

          make gki_defconfig
          scripts/config --module CONFIG_RTL8192EU
          make modules_prepare
          make -j$(nproc) M=drivers/net/wireless/rtl8192eu modules

      - name: Upload Finished Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-module
          path: source/drivers/net/wireless/rtl8192eu/8192eu.ko
