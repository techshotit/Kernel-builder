name: Build RTL8192EU Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential bc bison flex libssl-dev git libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Kernel Source & 5.15 Ready Driver
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git source
          git clone --depth=1 https://github.com/lwfinger/rtl8192eu.git rtl8192eu

      - name: Prepare Kernel Headers
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make gki_defconfig
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          make modules_prepare

      - name: Build 8192eu.ko Module
        run: |
          cd rtl8192eu
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_MODPOST_WARN=1

          make -C ../source M=$PWD modules EXTRA_CFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-declaration-after-statement -Wno-unused-function"

      - name: Upload Finished Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-module
          path: rtl8192eu/8192eu.ko
