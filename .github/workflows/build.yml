name: Build RTL8192EU Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential bc bison flex libssl-dev git libelf-dev clang lld llvm gcc-aarch64-linux-gnu curl

      - name: Clone Kernel Source & Download Verified Driver Archive
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git source
          mkdir -p source/drivers/net/wireless/rtl8192eu
          # Direct HTTP archive download (No Git authentication failure)
          curl -sL https://github.com/Mange/rtl8192eu-linux-driver/archive/refs/heads/realtek-4.4.x.tar.gz | tar -xz -C source/drivers/net/wireless/rtl8192eu --strip-components=1
          echo "obj-m += rtl8192eu/" >> source/drivers/net/wireless/Makefile
          sed -i 's/---help---/help/g' source/drivers/net/wireless/rtl8192eu/Kconfig || true
          sed -i '/endif/i source "drivers/net/wireless/rtl8192eu/Kconfig"' source/drivers/net/wireless/Kconfig

      - name: Prepare Kernel Headers
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make gki_defconfig
          scripts/config --module CONFIG_RTL8192EU
          make modules_prepare

      - name: Build 8192eu.ko Module
        run: |
          cd source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_MODPOST_WARN=1

          make -j$(nproc) M=drivers/net/wireless/rtl8192eu modules EXTRA_CFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-declaration-after-statement -Wno-unused-function -Wno-unused-variable -Wno-enum-conversion"

      - name: Upload Finished Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-module
          path: source/drivers/net/wireless/rtl8192eu/8192eu.ko
