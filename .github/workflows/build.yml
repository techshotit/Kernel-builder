name: Build RTL8192EU Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3 \
            rsync \
            cpio \
            kmod

      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/devhunter1/android_kernel_samsung_s5e8535.git \
            source

      - name: Find Kernel Configuration
        run: |
          cd source

          echo "Available ARM64 configurations:"
          find arch/arm64/configs \
            -maxdepth 2 \
            -type f \
            -name '*defconfig' \
            -print | sort

          echo
          echo "Searching for S5E8535 configurations:"

          find arch/arm64/configs \
            -type f \
            -iname '*s5e8535*' \
            -print || true

          echo
          echo "Searching for Samsung A14 configurations:"

          find arch/arm64/configs \
            -type f \
            -iname '*a14*' \
            -print || true

      - name: Configure Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          CONFIG=""

          # Look for the most likely S5E8535 configuration.
          CONFIG=$(find arch/arm64/configs \
            -type f \
            -iname '*s5e8535*defconfig' \
            | head -1 || true)

          # If no S5E8535 config exists, look for A14.
          if [ -z "$CONFIG" ]; then
            CONFIG=$(find arch/arm64/configs \
              -type f \
              -iname '*a14*defconfig' \
              | head -1 || true)
          fi

          # If still nothing, use gki_defconfig if available.
          if [ -z "$CONFIG" ] && \
             [ -f arch/arm64/configs/gki_defconfig ]; then
            CONFIG="arch/arm64/configs/gki_defconfig"
          fi

          if [ -z "$CONFIG" ]; then
            echo "ERROR: No suitable ARM64 defconfig found."
            exit 1
          fi

          CONFIG_NAME=$(basename "$CONFIG" | sed 's/_defconfig$//')

          echo "Using configuration:"
          echo "$CONFIG"

          make "$CONFIG_NAME"

          # Required dependencies
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_WLAN_VENDOR_REALTEK

          # RTL8XXXU
          scripts/config --module CONFIG_RTL8XXXU

          make olddefconfig

          echo
          echo "===== RTL CONFIG ====="

          grep -E \
            'CONFIG_(USB|WLAN|WIRELESS|MAC80211|CFG80211|MODULES|WLAN_VENDOR_REALTEK|RTL8XXXU)' \
            .config || true

          if ! grep -q '^CONFIG_RTL8XXXU=m$' .config; then
            echo
            echo "ERROR: CONFIG_RTL8XXXU=m is not enabled."
            exit 1
          fi

          echo
          echo "CONFIG_RTL8XXXU=m confirmed."

      - name: Prepare Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make prepare
          make modules_prepare

      - name: Build RTL8XXXU
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j"$(nproc)" \
            M=drivers/net/wireless/realtek/rtl8xxxu \
            modules \
            KCFLAGS="-Wno-error" \
            2>&1 | tee ../rtl8xxxu-build.log

      - name: Verify Module
        run: |
          cd source

          echo "Searching for rtl8xxxu.ko..."

          find . \
            -type f \
            -name "rtl8xxxu.ko" \
            -print

          if [ ! -f \
            drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko ]; then

            echo
            echo "ERROR: rtl8xxxu.ko was not created."

            echo
            echo "CONFIG:"
            grep -E \
              'CONFIG_(RTL8XXXU|MAC80211|CFG80211|WLAN|USB|MODULES)' \
              .config || true

            echo
            echo "MODULE ORDER:"
            cat \
              drivers/net/wireless/realtek/rtl8xxxu/modules.order \
              || true

            echo
            echo "BUILD LOG:"
            tail -200 ../rtl8xxxu-build.log || true

            exit 1
          fi

          echo
          echo "======================================"
          echo "SUCCESS"
          echo "rtl8xxxu.ko CREATED"
          echo "======================================"

      - name: Create Output
        run: |
          mkdir -p output

          cp \
            source/drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko \
            output/rtl8xxxu.ko

          cp \
            source/.config \
            output/kernel.config

          if [ -f source/Module.symvers ]; then
            cp source/Module.symvers \
              output/Module.symvers
          fi

          cd source

          make kernelversion \
            > ../output/kernel.version

          cd ..

          file output/rtl8xxxu.ko

          echo
          echo "Output:"
          ls -lh output/

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-s5e8535
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-build-log
          path: rtl8xxxu-build.log
          if-no-files-found: ignore
          retention-days: 30
        
