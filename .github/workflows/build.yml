name: Build RTL8192EU Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential bc bison flex libssl-dev git libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Samsung Kernel Source
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git source

      - name: Configure & Build Realtek In-Tree Driver
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make gki_defconfig

          # Enable wireless stack and the rtl8xxxu driver
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --module CONFIG_RTL8XXXU
          scripts/config --enable CONFIG_RTL8XXXU_UNTESTED

          make olddefconfig
          make modules_prepare

          # Compile and explicitly link .ko module binary
          make -j$(nproc) M=drivers/net/wireless/realtek/rtl8xxxu modules KCFLAGS="-Wno-error"

          # Collect generated .ko files into output directory
          mkdir -p ../output
          find drivers/net/wireless/realtek/rtl8xxxu/ -name "*.ko" -exec cp -v {} ../output/ \;

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8xxxu-driver-module
          path: output/*.ko
