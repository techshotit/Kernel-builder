name: Build RTL8192EU Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3 \
            rsync \
            cpio \
            kmod

      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/devhunter1/android_kernel_samsung_s5e8535.git \
            source

      - name: Configure Samsung Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Use Samsung's own device configuration
          make s5e8535-a14xxx_defconfig

          # Enable required dependencies
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_WLAN_VENDOR_REALTEK
          scripts/config --enable CONFIG_MODULES

          # Directly set RTL8XXXU to module
          scripts/config --module CONFIG_RTL8XXXU

          # Experimental USB devices
          scripts/config --enable CONFIG_RTL8XXXU_UNTESTED

          # Resolve dependencies
          make olddefconfig

          echo
          echo "===== RTL CONFIG ====="

          grep -E \
            'CONFIG_(USB|WLAN|WIRELESS|MAC80211|CFG80211|WLAN_VENDOR_REALTEK|RTL8XXXU|MODULES)' \
            .config || true

          echo
          echo "===== FORCE RTL8XXXU MODULE ====="

          # olddefconfig may disable it in this Samsung configuration.
          # Force the final .config entry after dependency resolution.
          sed -i '/^CONFIG_RTL8XXXU=/d' .config
          echo 'CONFIG_RTL8XXXU=m' >> .config

          echo
          grep '^CONFIG_RTL8XXXU=' .config

          if ! grep -q '^CONFIG_RTL8XXXU=m$' .config; then
            echo "ERROR: CONFIG_RTL8XXXU=m not present"
            exit 1
          fi

          echo
          echo "CONFIG_RTL8XXXU=m confirmed."

      - name: Prepare Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make prepare
          make modules_prepare

      - name: Build RTL8XXXU
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j"$(nproc)" \
            M=drivers/net/wireless/realtek/rtl8xxxu \
            modules \
            KCFLAGS="-Wno-error" \
            2>&1 | tee ../rtl8xxxu-build.log

      - name: Check Driver
        run: |
          cd source

          echo
          echo "===== SEARCHING MODULE ====="

          find . -name "rtl8xxxu.ko" -print

          if [ ! -f \
            drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko ]; then

            echo
            echo "ERROR: rtl8xxxu.ko was not created"

            echo
            echo "CONFIG:"
            grep -E \
              'CONFIG_(RTL8XXXU|MAC80211|CFG80211|USB|WLAN)' \
              .config || true

            echo
            echo "MODULE ORDER:"
            cat \
              drivers/net/wireless/realtek/rtl8xxxu/modules.order \
              || true

            echo
            echo "BUILD LOG:"
            tail -200 ../rtl8xxxu-build.log || true

            exit 1
          fi

          echo
          echo "======================================"
          echo "SUCCESS!"
          echo "rtl8xxxu.ko CREATED"
          echo "======================================"

          file \
            drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko

      - name: Create Output
        run: |
          mkdir -p output

          cp \
            source/drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko \
            output/rtl8xxxu.ko

          cp \
            source/.config \
            output/kernel.config

          if [ -f source/Module.symvers ]; then
            cp source/Module.symvers output/Module.symvers
          fi

          cd source
          make kernelversion > ../output/kernel.version

          cd ..

          echo
          echo "===== OUTPUT ====="
          ls -lh output/

          echo
          echo "===== MODULE INFO ====="
          modinfo output/rtl8xxxu.ko || true

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-s5e8535
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-build-log
          path: rtl8xxxu-build.log
          if-no-files-found: ignore
          retention-days: 30
