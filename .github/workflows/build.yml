name: Build RTL8192EU Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3 \
            rsync \
            cpio \
            kmod

      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            https://github.com/devhunter1/android_kernel_samsung_s5e8535.git \
            source

      - name: Configure Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make gki_defconfig

          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_MODULES
          scripts/config --module CONFIG_RTL8XXXU

          make olddefconfig

          echo
          echo "RTL8XXXU configuration:"
          grep CONFIG_RTL8XXXU .config || true

      - name: Prepare Kernel
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make prepare
          make modules_prepare

      - name: Build Kernel Symbols
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc) vmlinux KCFLAGS="-Wno-error"

          if [ ! -f Module.symvers ]; then
            echo "ERROR: Module.symvers not found"
            exit 1
          fi

          echo "Module.symvers created successfully"

      - name: Build RTL8192EU Driver
        run: |
          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc) \
            M=drivers/net/wireless/realtek/rtl8xxxu \
            modules \
            KCFLAGS="-Wno-error"

      - name: Find Driver
        run: |
          cd source

          echo "Searching for rtl8xxxu.ko..."

          find . -name "rtl8xxxu.ko" -print

          if [ ! -f drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko ]; then
            echo
            echo "ERROR: rtl8xxxu.ko was not created"
            echo
            echo "RTL8XXXU config:"
            grep CONFIG_RTL8XXXU .config || true
            echo
            echo "Build files:"
            ls -la drivers/net/wireless/realtek/rtl8xxxu/
            exit 1
          fi

      - name: Prepare Output
        run: |
          mkdir -p output

          cp source/drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko \
            output/

          cp source/.config \
            output/kernel.config

          cp source/Module.symvers \
            output/

          cd source
          make kernelversion > ../output/kernel.version

          cd ..

          echo "================================"
          echo "BUILD SUCCESS"
          echo "================================"

          ls -lh output/

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-s5e8535
          path: output/
          if-no-files-found: error
